services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=careersense
      - DB_USERNAME=careersense
      - DB_PASSWORD=careersense
      - AI_API_URL=http://ai:8000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.ai
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ai:/app
      - ./backend/storage/app/public:/var/www/html/public/storage
    depends_on:
      - backend
    environment:
      - STORAGE_ROOT=/var/www/html/public/storage
      - USE_SENTENCE_TRANSFORMER=true
      - SEMANTIC_MODEL=/app/models/indoSBERT-large
      - WHISPER_MODEL=base
      - WHISPER_CACHE_DIR=/app/models/whisper
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: careersense
      MYSQL_USER: careersense
      MYSQL_PASSWORD: careersense
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:

name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m

          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /home/Kelompok28/cv_web

            echo "🔓 Preparing repo permissions..."
            sudo chown -R $USER:$USER backend/storage backend/bootstrap/cache

            echo "📥 Pull latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Fixing Laravel permissions..."
            sudo mkdir -p backend/storage/framework/views
            sudo mkdir -p backend/storage/framework/cache/data
            sudo mkdir -p backend/storage/framework/sessions
            sudo mkdir -p backend/bootstrap/cache
            sudo chown -R 33:33 backend/storage backend/bootstrap/cache
            sudo chmod -R ug+rwX backend/storage backend/bootstrap/cache

            echo "🚀 Deploying containers..."
            docker compose up -d --build

            echo "⏳ Waiting app..."
            sleep 10

            echo "📦 Running migrations..."
            docker compose exec -T backend php artisan migrate --force

            echo "🧹 Clearing old cache..."
            docker compose exec -T backend rm -rf storage/framework/views/*
            docker compose exec -T backend rm -rf bootstrap/cache/*.php
            docker compose exec -T backend php artisan optimize:clear

            echo "🧪 Running tests..."
            docker compose exec -T backend php artisan test

            echo "⚡ Optimizing..."
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache
            docker compose exec -T backend php artisan view:cache

            echo "🔐 Final Laravel permissions..."
            sudo chown -R 33:33 backend/storage backend/bootstrap/cache
            sudo chmod -R ug+rwX backend/storage backend/bootstrap/cache

            echo "🗑️ Cleaning docker images..."
            docker image prune -af

            echo "✅ Deployment success!"